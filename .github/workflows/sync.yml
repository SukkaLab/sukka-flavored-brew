name: Upstream Sync

permissions: {}

on:
  schedule:
    - cron: "37 */6 * * *" # every 6 hours, off the busy top of the hour
  workflow_dispatch:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  sync_latest_from_upstream:
    name: Rebase onto upstream and tag the latest release
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # `GITHUB_TOKEN` cannot push upstream's `.github/workflows` changes.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/Homebrew/brew.git \
            +refs/heads/main:refs/upstream/main "+refs/tags/*:refs/upstream-tags/*"

          git rebase refs/upstream/main main

          # `brew update` checks out the newest `x.y.z` tag, so only that one needs our commits.
          upstream_tags="$(git for-each-ref --sort=-version:refname --format="%(refname:lstrip=2)" refs/upstream-tags)"
          tag="$(grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"${upstream_tags}")"
          git branch --force patched-tag main
          git rebase --onto "refs/upstream-tags/${tag}" refs/upstream/main patched-tag

          refspecs=(main)
          # Moving an unchanged tag would make every `brew update` refetch it.
          if [[ "$(git rev-parse -q --verify "refs/tags/${tag}^{tree}")" != "$(git rev-parse "patched-tag^{tree}")" ]]
          then
            refspecs+=("+patched-tag:refs/tags/${tag}")
          fi
          git push --atomic --force-with-lease=main origin "${refspecs[@]}"
